variables:
  # wheels.sh versions from git. The default shallow fetch hides the
  # tags, and the distance count is then the fetch depth, not the real
  # one, so wheels build with a silently wrong version.
  GIT_DEPTH: 0

stages: [alloc, test, build, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - ALLOC_NAME=dfdashboard-ci-$CI_PIPELINE_ID-$CI_JOB_ID
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# Shared allocation; test + docs both run on it via flux proxy.
test:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    # flux run -N 1 executes the script ON the allocated node; podman provides
    # the python environment (mirrors the GitHub Actions CI).
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/test-docs.sh
  artifacts:
    paths: [public]

image-build:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/docker-build.sh

wheels:
  extends: .corona-flux
  stage: build
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/wheels.sh
  artifacts:
    paths: [wheelhouse/]

# Needs both producers, so a failed wheel or test run publishes nothing.
distribute:
  extends: .corona-flux
  stage: deploy
  needs: [wheels, test]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash .gitlab/ci/distribute.sh

# Publishes the artifact from test — shell runner, no allocation.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [test]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "Publishing docs built by test"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → test/image-build → pages → deallocate.
  needs: [allocate, test, {job: image-build, optional: true}, {job: wheels, optional: true}, {job: pages, optional: true}]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - test -s .flux-jobid && flux cancel "$(cat .flux-jobid)" || true
