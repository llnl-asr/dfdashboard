[project]
name = "dftracer-dashboard"
version = "0.0.1"
description = "A browser dashboard for DFTracer traces, the interactive visualization layer of the DataFlowX suite"
readme = "README.md"
authors = [
  { name = "Ray A. O. Sinurat", email = "raydreww@gmail.com" },
  { name = "Hariharan Devarajan", email = "hariharandev1@llnl.gov" },
]
requires-python = ">=3.10"
dependencies = [
  # Every floor is the newest release that still runs on 3.10, so a 3.10
  # interpreter resolves to it and a newer one still takes the latest.
  "panel>=1.9.4",
  "hvplot>=0.12",
  "holoviews>=1.23",
  "bokeh>=3.9",
  "bokeh-fastapi>=0.1.8",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "starlette-compress>=1.8",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "pyarrow>=25",
  "numpy>=2.2",
  "rich>=14",
  # pydantic only accepts typing_extensions.TypedDict and NotRequired below
  # 3.12, and the payloads are response models.
  "typing_extensions>=4.12",
  # A .dev0 floor opts the requirement into the develop-branch prerelease wheels
  # and still accepts later finals (a floor carrying a prerelease segment is what
  # makes pip and uv resolve prereleases for that requirement).
  "dftracer-utils>=0.0.14.dev0",
]


[project.optional-dependencies]
scale = ["datashader>=0.19", "dask[distributed]>=2026.8"]
builder = ["panel-graphic-walker>=0.6.5"]
mcp = ["fastmcp>=4"]
export = ["weasyprint>=70", "playwright>=1.64"]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7",
  "httpx>=0.28",
  "ruff>=0.17",
  "ty>=0.0.91",
  # 4.7 is the first release that needs 3.11; the hooks are a local tool, so
  # the 3.10 job skips them.
  "pre-commit>=4.7; python_version >= '3.11'",
]

[project.scripts]
dfdashboard-serve = "dftracer.dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Built by the wheels job, so gitignored; artifacts includes VCS-ignored paths.
# Needed on both targets: `python -m build` builds the wheel from the sdist, so
# a wheel-only rule yields a wheel with no frontend.
[tool.hatch.build.targets.sdist]
include = ["python/dftracer", "web/dist", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
# dftracer/ carries no __init__.py: it is a PEP 420 namespace shared with
# dftracer-utils, so this wheel contributes only its own child.
# sources=python makes the wheel path dftracer/dashboard/...
only-include = ["python/dftracer"]
sources = ["python"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
