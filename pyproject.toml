[project]
name = "dfdashboard"
version = "0.0.1"
description = "The Interactive Visualization Layer of the DataFlowX Suite"
readme = "README.md"
authors = [
  { name = "Ray A. O. Sinurat", email = "raydreww@gmail.com" },
  { name = "Hariharan Devarajan", email = "hariharandev1@llnl.gov" },
]
requires-python = ">=3.12"
dependencies = [
  "panel>=1.10",
  "hvplot>=0.12",
  "holoviews>=1.23",
  "bokeh>=3.10",
  "bokeh-fastapi>=0.1.8",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "starlette-compress>=1.8",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "pyarrow>=26",
  "numpy>=2.5",
  "numba>=0.68",
  "reactivex>=6",
  # dftracer-analyzer pins rich~=14.1.0, so 14 is the highest floor that resolves.
  "rich>=14",
  # .dev0 floors opt these two into the develop-branch prerelease wheels and
  # still accept later finals (a floor carrying a prerelease segment is what
  # makes pip and uv resolve prereleases for that requirement).
  "dftracer-utils>=0.0.14.dev0",
  "dftracer-analyzer>=0.0.9.post61.dev0",
]


[project.optional-dependencies]
scale = ["datashader>=0.19", "dask[distributed]>=2026.8"]
builder = ["panel-graphic-walker>=0.6.5"]
mcp = ["fastmcp>=4"]
export = ["weasyprint>=70", "playwright>=1.64"]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "httpx>=0.28",
  "ruff>=0.17",
  "ty>=0.0.91",
  "pre-commit>=4.7",
]

[project.scripts]
dfdashboard-serve = "dfdashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Built by the wheels job, so gitignored; artifacts includes VCS-ignored paths.
# Needed on both targets: `python -m build` builds the wheel from the sdist, so
# a wheel-only rule yields a wheel with no frontend.
[tool.hatch.build.targets.sdist]
artifacts = ["dfdashboard/web_dist/**"]

[tool.hatch.build.targets.wheel]
artifacts = ["dfdashboard/web_dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
